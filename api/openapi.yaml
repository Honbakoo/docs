          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already pending, or caller can edit directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many pending suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/editorial/suggestions:
    get:
      tags: [Editorial]
      operationId: listEditSuggestions
      summary: Review queue or the caller's own suggestions
      security:
        - BearerAuth: []
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [review, mine], default: review }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, all], default: pending }
        - name: manga_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Suggestions, newest first; pending review items include `current` values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditSuggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/editorial/suggestions/{id}:
    delete:
      tags: [Editorial]
      operationId: withdrawEditSuggestion
      summary: Withdraw one's own pending suggestion
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Withdrawn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/editorial/suggestions/{id}/approve:
    post:
      tags: [Editorial]
      operationId: approveEditSuggestion
      summary: Approve and apply a pending suggestion
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewEditSuggestionRequest'
      responses:
        '200':
          description: Approved suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/editorial/suggestions/{id}/reject:
    post:
      tags: [Editorial]
      operationId: rejectEditSuggestion
      summary: Reject a pending suggestion
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewEditSuggestionRequest'
      responses:
        '200':
          description: Rejected suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/editorial/mangas/{id}/chapters:
    get:
      tags: [Editorial]
      operationId: listStudioChapters
      summary: List all chapters for a work including unpublished drafts
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Studio chapter list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    viewer_permissions:
                      $ref: '#/components/schemas/ChapterPermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Editorial]
      operationId: createChapter
      summary: Create a chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterRequest'
      responses:
        '4XX':
          description: Client error
        '201':
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterSummary'

  /api/v1/editorial/chapters/{id}:
    patch:
      tags: [Editorial]
      operationId: updateChapter
      summary: Edit or publish a chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChapterRequest'
      responses:
        '4XX':
          description: Client error
        '200':
          description: Updated chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterSummary'
    delete:
      tags: [Editorial]
      operationId: deleteChapter
      summary: Delete a chapter and its pages
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '4XX':
          description: Client error
        '204':
          description: Deleted

  /api/v1/editorial/chapters/{id}/pages:
    get:
      tags: [Editorial]
      operationId: listStudioChapterPages
      summary: List chapter pages for editorial management including draft chapters
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Studio chapter pages
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Editorial]
      operationId: uploadPage
      summary: Upload a page image (multipart/form-data)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, page_number]
              properties:
                file:
                  type: string
                  format: binary
                page_number:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Page attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '413':
          description: Payload too large
        '403':
          description: Blocked media or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/chapters/{id}/pages/import:
    post:
      tags: [Editorial]
      operationId: importPages
      summary: Append pages from remote image URLs
      description: Fetches through the SSRF-safe ingestion client and stores via CAS.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: uri }
      responses:
        '4XX':
          description: Client error
        '201':
          description: Pages imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  pages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Media'
        '502':
          description: Upstream fetch failed (no internal details leaked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/chapters/{id}/pages/order:
    patch:
      tags: [Editorial]
      operationId: reorderPages
      summary: Reorder pages atomically
      description: |
        `page_numbers` must be a full permutation of the chapter's current page
        numbers. Index 0 becomes page 1.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page_numbers]
              properties:
                page_numbers:
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Pages reordered
        '400':
          description: Not a full permutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/chapters/{id}/pages/{page_number}:
    delete:
      tags: [Editorial]
      operationId: deletePage
      summary: Delete a page
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: page_number
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Admin ----
  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: List accounts (keyset pagination)
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Accounts
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  next_cursor: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/reports:
    get:
      tags: [Admin]
      operationId: adminListReports
      summary: List open reports across the platform
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Open reports
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/reports/{id}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolveReport
      summary: Resolve any report
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '204':
          description: Resolved
        '409':
          description: Report already resolved

  /api/v1/admin/dmca/block:
    post:
      tags: [Admin]
      operationId: dmcaBlock
      summary: DMCA-block a work or chapter (cascades to chapters in the reader)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type:
                  type: string
                  enum: [manga, chapter]
                target_id: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '204':
          description: Blocked
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/dmca/unblock:
    post:
      tags: [Admin]
      operationId: dmcaUnblock
      summary: Lift a DMCA block
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type:
                  type: string
                  enum: [manga, chapter]
                target_id: { type: string, format: uuid }
      responses:
        '204':
          description: Unblocked
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users/{id}/ban:
    post:
      tags: [Admin]
      operationId: banUser
      summary: Suspend an account
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Banned
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{id}/unban:
    post:
      tags: [Admin]
      operationId: unbanUser
      summary: Restore a suspended account
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '4XX':
          description: Client error
        '204':
          description: Unbanned

  # -------------------------------------------------------------- Billing ----
  /api/v1/billing/webhook:
    post:
      tags: [Billing]
      operationId: billingWebhook
      summary: Payment provider webhook (HMAC + anti-replay + idempotency)
      security: []
      parameters:
        - name: X-Honbakoo-Signature
          in: header
          schema: { type: string }
        - name: Stripe-Signature
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted or already processed
        '401':
          description: Invalid signature
        '503':
          description: Billing disabled on this deployment

  /api/v1/billing/webhook/{provider}:
    post:
      tags: [Billing]
      operationId: billingWebhookProvider
      summary: Payment provider webhook with explicit provider segment
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [stripe, generic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted or already processed
        '401':
          description: Invalid signature

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Dependency unavailable, maintenance mode, or feature disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        code: { type: string }

    AgeVerificationStatus:
      type: object
      required: [status, required]
      properties:
        status:
          type: string
          enum: [unverified, pending, verified, rejected, expired]
        method: { type: string }
        verified_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        rejected_reason: { type: string }
        required:
          type: boolean
          description: Whether this deployment requires age verification for NSFW content.

    AgeVerificationResult:
      type: object
      required: [status, age_verified, access_token, method]
      properties:
        status: { type: string, enum: [verified] }
        age_verified: { type: boolean }
        access_token:
          type: string
          description: Refreshed JWT so the client is unblocked immediately.
        method: { type: string }
        message: { type: string }

    Health:
      type: object
      properties:
        status: { type: string }
        timestamp: { type: string, format: date-time }
        version: { type: string }

    Ready:
      type: object
      properties:
        status: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
        timestamp: { type: string, format: date-time }

    PublicConfig:
      type: object
      properties:
        site_name: { type: string }
        public_url: { type: string }
        profile: { type: string, enum: [budget, scale] }
        allow_registration: { type: boolean }
        age_verification_mode: { type: string, enum: [disabled, self_declaration, strict] }
        billing_enabled: { type: boolean }
        comments_enabled: { type: boolean }
        reports_enabled: { type: boolean }
        download_mode: { type: string, enum: [disabled, public, vip_only] }
        catalog_mode: { type: string, enum: [hybrid, sfw_only, nsfw_only] }
        read_only: { type: boolean }
        editorial_policy: { type: string, enum: [group_member, open, admin_only] }
        edit_suggestions_enabled: { type: boolean }

    WorkPermissions:
      type: object
      required: [can_view, can_edit, can_delete, can_create_chapter, can_review_suggestions, can_suggest]
      properties:
        can_view: { type: boolean }
        can_edit: { type: boolean }
        can_delete: { type: boolean }
        can_create_chapter: { type: boolean }
        can_review_suggestions: { type: boolean }
        can_suggest: { type: boolean }

    ChapterPermissions:
      type: object
      required: [can_edit, can_delete]
      properties:
        can_edit: { type: boolean }
        can_delete: { type: boolean }

    EditSuggestionPayload:
      type: object
      description: Whitelisted work fields; omitted fields are unchanged.
      properties:
        original_title: { type: string, maxLength: 255 }
        localized_title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 5000 }
        language_code:
          type: string
          maxLength: 10
          description: Localization targeted by localized_title/description (default pt-br).
        status: { type: string, enum: [ongoing, completed, hiatus, cancelled] }
        format: { type: string, enum: [manga, manhwa, manhua, doujinshi, anime_h, anime_m] }
        reading_direction: { type: string, enum: [right_to_left, left_to_right, vertical_scroll] }
        original_language: { type: string, maxLength: 10 }
        tag_ids:
          type: array
          maxItems: 100
          items: { type: integer, format: int32 }
        creators:
          type: array
          maxItems: 30
          items:
            type: object
            required: [name, role]
            properties:
              name: { type: string }
              role: { type: string }
        is_nsfw: { type: boolean }

    CreateEditSuggestionRequest:
      allOf:
        - $ref: '#/components/schemas/EditSuggestionPayload'
        - type: object
          properties:
            note: { type: string, maxLength: 1000 }

    ReviewEditSuggestionRequest:
      type: object
      properties:
        note: { type: string, maxLength: 1000 }

    EditSuggestion:
      type: object
      required: [id, manga_id, manga_slug, manga_title, payload, note, status, review_note, created_at]
      properties:
        id: { type: string, format: uuid }
        manga_id: { type: string, format: uuid }
        manga_slug: { type: string }
        manga_title: { type: string }
        author_id: { type: string, format: uuid }
        author_username: { type: string }
        payload:
          $ref: '#/components/schemas/EditSuggestionPayload'
        current:
          $ref: '#/components/schemas/EditSuggestionPayload'
        note: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewer_username: { type: string }
        review_note: { type: string }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        preferred_language: { type: string, default: pt-br }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, moderator, admin] }
        preferred_language: { type: string }
        age_verified: { type: boolean }
        is_banned: { type: boolean }
        vip_until: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token: { type: string }
        refresh_token: { type: string }

    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    APIKeyCreated:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          properties:
            key: { type: string, description: Shown only once. }

    MangaSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        original_title: { type: string }
        display_title: { type: string }
        format: { type: string }
        status: { type: string }
        cover_url: { type: string }
        is_nsfw: { type: boolean }
        tag_ids:
          type: array
          items: { type: integer }
        views_all_time: { type: integer }
        rating_score: { type: number }
        created_at: { type: string, format: date-time }

    MangaDetail:
      type: object
      properties:
        manga:
          type: object
          additionalProperties: true
        creators:
          type: array
          items:
            type: object
            additionalProperties: true

    MangaEditorial:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        original_title: { type: string }
        format: { type: string }
        status: { type: string }
        is_nsfw: { type: boolean }
        cover_url: { type: string }
        is_published: { type: boolean }
        published_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    CreateMangaRequest:
      type: object
      required: [original_title, slug, cover_url]
      properties:
        original_title: { type: string }
        original_language: { type: string, default: ja }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        format:
          type: string
          enum: [manga, manhwa, manhua, doujinshi, comic, webtoon, light_novel, anime, anime_h]
        reading_direction:
          type: string
          enum: [right_to_left, left_to_right, top_to_bottom]
        is_gallery: { type: boolean }
        is_nsfw: { type: boolean }
        is_vip_exclusive: { type: boolean }
        cover_url: { type: string }
        tag_ids:
          type: array
          items: { type: integer }
        is_published: { type: boolean }
        group_id: { type: string, format: uuid }

    UpdateMangaRequest:
      type: object
      description: Partial update; omitted fields are unchanged. Requires maintainer rights.
      properties:
        original_title: { type: string }
        localized_title: { type: string }
        description: { type: string }
        language_code: { type: string, description: "Localization targeted by localized_title/description (default pt-br)." }
        original_language: { type: string }
        format: { type: string, enum: [manga, manhwa, manhua, doujinshi, anime_h, anime_m] }
        reading_direction: { type: string, enum: [right_to_left, left_to_right, vertical_scroll] }
        status:
          type: string
          enum: [ongoing, completed, hiatus, cancelled]
        cover_url: { type: string }
        magazine_id: { type: string, description: "UUID, or empty string to clear." }
        creators:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              name: { type: string }
              role: { type: string }
        tag_ids:
          type: array
          items: { type: integer }
        is_nsfw: { type: boolean }
        is_vip_exclusive: { type: boolean }
        is_gallery: { type: boolean }
        is_published: { type: boolean }

    CreateChapterRequest:
      type: object
      required: [chapter_number]
      properties:
        group_id: { type: string, format: uuid }
        chapter_number: { type: number }
        volume_number: { type: string }
        title: { type: string }
        language_code: { type: string, default: pt-br }
        media_type: { type: string, enum: [image_pages, video_stream] }
        is_vip_early_access: { type: boolean }
        is_vip_exclusive: { type: boolean }
        is_published: { type: boolean }

    UpdateChapterRequest:
      type: object
      properties:
        chapter_number: { type: number }
        volume_number: { type: string }
        title: { type: string }
        is_vip_early_access: { type: boolean }
        is_vip_exclusive: { type: boolean }
        is_published: { type: boolean }

    ChapterSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        manga_id: { type: string, format: uuid }
        group_id: { type: [string, "null"], format: uuid }
        group_name: { type: [string, "null"] }
        chapter_number: { type: number }
        volume_number: { type: [string, "null"] }
        title: { type: [string, "null"] }
        language_code: { type: string }
        media_type: { type: string, enum: [image_pages, video_stream] }
        is_vip_early_access: { type: boolean }
        is_vip_exclusive: { type: boolean }
        published_at: { type: [string, "null"], format: date-time }

    ChapterReader:
      type: object
      properties:
        chapter:
          type: object
          additionalProperties: true
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/VideoSource'

    Page:
      type: object
      properties:
        page_number: { type: integer }
        media_id: { type: string, format: uuid }
        url:
          type: string
          description: CDN URL for public pages, or the protected media endpoint for gated pages.
        access:
          type: string
          enum: [cdn, protected, unavailable]
        storage_provider: { type: string }
        storage_key:
          type: [string, "null"]
          description: Omitted for protected pages so the CDN key is not leaked.
        mime_type: { type: string }
        byte_size: { type: integer }
        width: { type: integer }
        height: { type: integer }
        blurhash: { type: [string, "null"] }
        variants:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PageVariant'

    PageVariant:
      type: object
      properties:
        url: { type: string }
        mime_type: { type: string }
        width: { type: integer }
        height: { type: integer }
        byte_size: { type: integer }

    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        sha256_hash: { type: string }
        storage_key: { type: string }
        public_url: { type: string }
        mime_type: { type: string }
        byte_size: { type: integer }
        width: { type: integer }
        height: { type: integer }
        deduplicated: { type: boolean }

    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        category: { type: string }

    UpdatesPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor: { type: string }

    HistoryEntry:
      type: object
      properties:
        manga_id: { type: string, format: uuid }
        manga_slug: { type: string }
        manga_title: { type: string }
        manga_cover_url: { type: string }
        is_nsfw: { type: boolean }
        last_chapter_id: { type: [string, "null"], format: uuid }
        chapter_number: { type: [number, "null"] }
        chapter_title: { type: [string, "null"] }
        last_page: { type: integer }
        last_video_position_seconds: { type: integer }
        updated_at: { type: string, format: date-time }

    VideoSource:
      type: object
      properties:
        id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        source_type:
          type: string
          enum: [direct_hls, direct_mp4, external_embed]
        resolution: { type: string, example: "1080p" }
        stream_url: { type: string, format: uri }
        server_name: { type: string }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        avatar_url: { type: string }
        user_role: { type: string }
        chapter_id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        path: { type: string }
        depth: { type: integer }
        content: { type: string }
        likes_count: { type: integer }
        dislikes_count: { type: integer }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }

    ResolveReportRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [upheld, rejected, duplicate, action_taken]
        note: { type: string, maxLength: 2000 }

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, moderator, admin] }
        is_banned: { type: boolean }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
