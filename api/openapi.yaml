openapi: 3.1.0
info:
  title: Honbakoo Engine API
  version: 1.0.0
  description: API RESTful headless, stateless e de altíssima performance para plataformas
    de entretenimento visual (Mangás, Doujinshis, Manhwas, Animes e Anime-H).
  contact:
    name: Honbakoo Architecture Team
    url: https://github.com/Honbakoo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://api.honbakoo.org/api/v1
  description: Produção
- url: http://localhost:8080/api/v1
  description: Desenvolvimento Local
tags:
- name: Health & System
  description: Sondas de monitoramento e prontidão
- name: Auth & Session
  description: Autenticação, MFA, e-mail e sessões
- name: Users & Profile
  description: Dados do leitor, histórico, favoritos e LGPD
- name: Catalog & Mangas
  description: Obras, tags, criadores e avaliações
- name: Reader & Media
  description: Páginas de leitura e streams de vídeo
- name: Community & Comments
  description: Comentários em árvore LTree e reações
- name: Uploads & Ingestion
  description: Slots de upload CAS e ingestão
- name: Reports & Support
  description: Denúncias e tickets de suporte
- name: Admin & Moderation
  description: DMCA, moderação e API Keys
- name: Webhooks
  description: Webhooks de gateways de pagamento
security:
- {}
- BearerAuth: []
- ApiKeyAuth: []
paths:
  /healthz:
    get:
      tags:
      - Health & System
      summary: Liveness Probe
      operationId: getLiveness
      responses:
        '200':
          description: Processo saudável
  /readyz:
    get:
      tags:
      - Health & System
      summary: Readiness Probe
      operationId: getReadiness
      responses:
        '200':
          description: Dependências saudáveis
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register:
    post:
      tags:
      - Auth & Session
      summary: Registro de novo usuário
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
      - Auth & Session
      summary: Login de usuário
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
      - Auth & Session
      summary: Rotação de Refresh Token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens renovados
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth & Session
      security:
      - BearerAuth: []
      summary: Revogação da sessão atual
      operationId: logoutUser
      responses:
        '200':
          description: Deslogado com sucesso
  /auth/verify-email:
    post:
      tags:
      - Auth & Session
      summary: Confirmação de token de e-mail
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: E-mail verificado
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/forgot-password:
    post:
      tags:
      - Auth & Session
      summary: Solicitação de redefinição de senha
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: E-mail de recuperação enviado (resposta uniforme)
  /auth/reset-password:
    post:
      tags:
      - Auth & Session
      summary: Redefinição de senha com token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Senha alterada com sucesso
  /auth/change-password:
    post:
      tags:
      - Auth & Session
      security:
      - BearerAuth: []
      summary: Alteração de senha autenticada
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - old_password
              - new_password
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Senha atualizada
  /users/me:
    get:
      tags:
      - Users & Profile
      security:
      - BearerAuth: []
      summary: Perfil do usuário autenticado
      operationId: getProfile
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
    patch:
      tags:
      - Users & Profile
      security:
      - BearerAuth: []
      summary: Atualizar dados do perfil
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferred_language:
                  type: string
                avatar_url:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
    delete:
      tags:
      - Users & Profile
      security:
      - BearerAuth: []
      summary: Exclusão / Anonimização de conta (LGPD)
      operationId: deleteAccount
      responses:
        '200':
          description: Conta anonimizada e desativada
  /users/me/export:
    post:
      tags:
      - Users & Profile
      security:
      - BearerAuth: []
      summary: Exportação de dados pessoais (LGPD/GDPR)
      operationId: exportUserData
      responses:
        '200':
          description: Arquivo JSON com todos os dados do leitor
  /users/me/library:
    get:
      tags:
      - Users & Profile
      security:
      - BearerAuth: []
      summary: Obras favoritadas do usuário
      operationId: getLibrary
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 24
      responses:
        '200':
          description: Lista de favoritos
  /users/me/history:
    get:
      tags:
      - Users & Profile
      security:
      - BearerAuth: []
      summary: Histórico de leitura e progresso de vídeo
      operationId: getHistory
      responses:
        '200':
          description: Lista de histórico
    post:
      tags:
      - Users & Profile
      security:
      - BearerAuth: []
      summary: Atualizar progresso de leitura ou posição do vídeo
      operationId: updateHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - manga_id
              - chapter_id
              properties:
                manga_id:
                  type: string
                  format: uuid
                chapter_id:
                  type: string
                  format: uuid
                last_page:
                  type: integer
                last_video_position_seconds:
                  type: integer
      responses:
        '200':
          description: Progresso registrado
  /mangas:
    get:
      tags:
      - Catalog & Mangas
      summary: Busca e catálogo universal
      operationId: listMangas
      parameters:
      - name: format
        in: query
        schema:
          $ref: '#/components/schemas/ContentFormat'
      - name: lang
        in: query
        schema:
          type: string
          default: pt-br
      - name: tags_include
        in: query
        schema:
          type: array
          items:
            type: string
      - name: tags_exclude
        in: query
        schema:
          type: array
          items:
            type: string
      - name: creator
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - trending
          - popular
          - latest
          - rating
          default: trending
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 24
      responses:
        '200':
          $ref: '#/components/responses/MangaListResponse'
  /mangas/{slug}:
    get:
      tags:
      - Catalog & Mangas
      summary: Detalhes de uma obra
      operationId: getMangaDetails
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          type: string
          default: pt-br
      responses:
        '200':
          $ref: '#/components/responses/MangaDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /mangas/{slug}/chapters:
    get:
      tags:
      - Catalog & Mangas
      summary: Lista de capítulos de uma obra
      operationId: getMangaChapters
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Lista de capítulos agrupados por idioma e grupo
  /mangas/{id}/rating:
    put:
      tags:
      - Catalog & Mangas
      security:
      - BearerAuth: []
      summary: Avaliar uma obra (1 a 10)
      operationId: rateManga
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '200':
          description: Avaliação salva
    delete:
      tags:
      - Catalog & Mangas
      security:
      - BearerAuth: []
      summary: Remover avaliação da obra
      operationId: deleteRating
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Avaliação removida
  /mangas/{id}/favorite:
    post:
      tags:
      - Catalog & Mangas
      security:
      - BearerAuth: []
      summary: Adicionar aos favoritos
      operationId: addFavorite
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Obra favoritada
    delete:
      tags:
      - Catalog & Mangas
      security:
      - BearerAuth: []
      summary: Remover dos favoritos
      operationId: removeFavorite
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Removido dos favoritos
  /tags:
    get:
      tags:
      - Catalog & Mangas
      summary: Listar todas as tags canônicas com contadores
      operationId: listTags
      responses:
        '200':
          description: Lista de tags
  /tags/proposals:
    post:
      tags:
      - Catalog & Mangas
      security:
      - BearerAuth: []
      summary: Proposta de tag para moderação
      operationId: proposeTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - manga_id
              - tag_id
              properties:
                manga_id:
                  type: string
                  format: uuid
                tag_id:
                  type: integer
      responses:
        '201':
          description: Proposta submetida
  /creators/{slug}:
    get:
      tags:
      - Catalog & Mangas
      summary: Perfil de criador (roteirista/artista)
      operationId: getCreatorProfile
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Perfil do criador com obras vinculadas
  /updates:
    get:
      tags:
      - Catalog & Mangas
      summary: Feed dos últimos capítulos lançados
      operationId: getLatestUpdates
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 30
      responses:
        '200':
          description: Últimos lançamentos com thumbnail e grupo
  /chapters/{id}:
    get:
      tags:
      - Reader & Media
      summary: Metadados de um capítulo
      operationId: getChapterMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Metadados do capítulo
  /chapters/{id}/pages:
    get:
      tags:
      - Reader & Media
      summary: Manifesto de páginas para leitura
      operationId: getChapterPages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/ChapterPagesManifest'
        '403':
          description: Capítulo restrito a assinantes VIP
  /chapters/{id}/sources:
    get:
      tags:
      - Reader & Media
      summary: Fontes de streaming e legendas (Anime)
      operationId: getEpisodeSources
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/EpisodeSourcesManifest'
  /chapters/{id}/comments:
    get:
      tags:
      - Community & Comments
      summary: Árvore de comentários do capítulo
      operationId: getComments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Árvore de comentários
    post:
      tags:
      - Community & Comments
      security:
      - BearerAuth: []
      summary: Publicar comentário
      operationId: postComment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                parent_id:
                  type: string
                  format: uuid
                content:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Comentário publicado
  /comments/{id}/react:
    post:
      tags:
      - Community & Comments
      security:
      - BearerAuth: []
      summary: Curtir ou descurtir comentário
      operationId: reactComment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - is_like
              properties:
                is_like:
                  type: boolean
      responses:
        '200':
          description: Reação registrada
  /uploads/presigned-url:
    post:
      tags:
      - Uploads & Ingestion
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Solicitar slots de upload CAS (scale)
      operationId: requestUploadSlots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedRequest'
      responses:
        '200':
          description: Slots gerados
  /uploads/{upload_id}:
    put:
      tags:
      - Uploads & Ingestion
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Envio direto de arquivo no modo budget
      operationId: uploadDirectFile
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Arquivo gravado
  /uploads/complete:
    post:
      tags:
      - Uploads & Ingestion
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Finalização e validação de sessão de upload
      operationId: completeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Upload verificado
  /ingest/manga:
    post:
      tags:
      - Uploads & Ingestion
      security:
      - ApiKeyAuth: []
      summary: Ingestão automatizada de obra
      operationId: ingestManga
      responses:
        '201':
          description: Obra criada via ingestão
  /ingest/chapter:
    post:
      tags:
      - Uploads & Ingestion
      security:
      - ApiKeyAuth: []
      summary: Ingestão automatizada de capítulo
      operationId: ingestChapter
      responses:
        '201':
          description: Capítulo criado via ingestão
  /reports:
    post:
      tags:
      - Reports & Support
      security:
      - BearerAuth: []
      summary: Abrir denúncia / ticket de suporte
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Ticket aberto
  /admin/reports:
    get:
      tags:
      - Admin & Moderation
      security:
      - BearerAuth: []
      summary: Listar denúncias pendentes
      operationId: listReports
      parameters:
      - name: status
        in: query
        schema:
          type: string
          default: open
      responses:
        '200':
          description: Fila de moderação
  /admin/reports/{id}:
    patch:
      tags:
      - Admin & Moderation
      security:
      - BearerAuth: []
      summary: Resolver denúncia
      operationId: resolveReport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resolution
              properties:
                resolution:
                  type: string
                  enum:
                  - removed
                  - dismissed
                  - warned
                  - banned
                resolution_note:
                  type: string
      responses:
        '200':
          description: Denúncia resolvida
  /admin/dmca/block:
    post:
      tags:
      - Admin & Moderation
      security:
      - BearerAuth: []
      summary: Bloquear obra/capítulo e adicionar hashes à blacklist
      operationId: dmcaBlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - manga_slug
              - reason
              properties:
                manga_slug:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Conteúdo bloqueado e purgado
  /admin/dmca/unblock:
    post:
      tags:
      - Admin & Moderation
      security:
      - BearerAuth: []
      summary: Desbloquear obra contestada
      operationId: dmcaUnblock
      responses:
        '200':
          description: Desbloqueado
  /admin/api-keys:
    get:
      tags:
      - Admin & Moderation
      security:
      - BearerAuth: []
      summary: Listar API Keys ativas
      operationId: listApiKeys
      responses:
        '200':
          description: Lista de chaves
    post:
      tags:
      - Admin & Moderation
      security:
      - BearerAuth: []
      summary: Gerar nova API Key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - scopes
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expires_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Chave gerada (segredo retornado uma única vez)
  /admin/api-keys/{id}:
    delete:
      tags:
      - Admin & Moderation
      security:
      - BearerAuth: []
      summary: Revogar API Key
      operationId: revokeApiKey
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Chave revogada
  /webhooks/billing/{provider}:
    post:
      tags:
      - Webhooks
      summary: Webhook de provedores de pagamento VIP (Stripe, Pix, Crypto)
      operationId: handleBillingWebhook
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Evento idempotente processado
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Não autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflito de chave ou duplicidade
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Dependência essencial indisponível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserResponse:
      description: Dados do usuário
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserEnvelope'
    LoginSuccess:
      description: Autenticado com sucesso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginEnvelope'
    MangaListResponse:
      description: Lista de obras
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MangaListEnvelope'
    MangaDetailResponse:
      description: Detalhes da obra
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MangaDetailEnvelope'
    ChapterPagesManifest:
      description: Manifesto de leitura
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChapterPagesManifestSchema'
    EpisodeSourcesManifest:
      description: Fontes de vídeo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EpisodeSourcesManifestSchema'
  schemas:
    ContentFormat:
      type: string
      enum:
      - manga
      - manhwa
      - manhua
      - doujinshi
      - anime_h
      - anime_m
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
              example: Dados inválidos.
            details:
              type: object
              nullable: true
    RegisterRequest:
      type: object
      required:
      - username
      - email
      - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        preferred_language:
          type: string
          default: pt-br
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
    User:
      type: object
      required:
      - id
      - username
      - email
      - role
      - preferred_language
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - guest
          - user
          - vip
          - moderator
          - admin
        preferred_language:
          type: string
        avatar_url:
          type: string
          nullable: true
    UserEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'
    LoginEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              type: object
              properties:
                access_token:
                  type: string
                token_type:
                  type: string
                  example: Bearer
                expires_in:
                  type: integer
                  example: 900
                refresh_token:
                  type: string
    MangaSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_title:
          type: string
        original_title:
          type: string
        slug:
          type: string
        format:
          $ref: '#/components/schemas/ContentFormat'
        reading_direction:
          type: string
          enum:
          - right_to_left
          - left_to_right
          - vertical_scroll
        is_gallery:
          type: boolean
        is_nsfw:
          type: boolean
        cover_url:
          type: string
        views_all_time:
          type: integer
        rating_score:
          type: string
    MangaListEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MangaSummary'
        meta:
          type: object
          properties:
            next_cursor:
              type: string
              nullable: true
            has_more:
              type: boolean
    MangaDetailEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/MangaSummary'
    ChapterPagesManifestSchema:
      type: object
      properties:
        chapter_id:
          type: string
          format: uuid
        reading_direction:
          type: string
        pages:
          type: array
          items:
            type: object
            properties:
              page_number:
                type: integer
              url:
                type: string
    EpisodeSourcesManifestSchema:
      type: object
      properties:
        chapter_id:
          type: string
          format: uuid
        sources:
          type: array
          items:
            type: object
            properties:
              server_name:
                type: string
              stream_url:
                type: string
        subtitles:
          type: array
          items:
            type: object
            properties:
              language_code:
                type: string
              subtitle_url:
                type: string
    PresignedRequest:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          items:
            type: object
            required:
            - filename
            - byte_size
            - sha256_hash
            - mime_type
            properties:
              filename:
                type: string
              byte_size:
                type: integer
              sha256_hash:
                type: string
              mime_type:
                type: string
    CreateReportRequest:
      type: object
      required:
      - target_type
      - target_id
      - reason
      properties:
        target_type:
          type: string
          enum:
          - chapter
          - manga
          - comment
          - user
        target_id:
          type: string
          format: uuid
        reason:
          type: string
        details:
          type: string
