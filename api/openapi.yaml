openapi: 3.1.0
info:
  title: Honbakoo Engine API
  version: 1.0.0
  description: |
    API RESTful headless, stateless e de altíssima performance para plataformas de entretenimento visual
    (Mangás, Doujinshis, Manhwas, Animes e Anime-H).
  contact:
    name: Honbakoo Architecture Team
    url: https://github.com/Honbakoo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.honbakoo.org/api/v1
    description: Servidor de Produção (Exemplo)
  - url: http://localhost:8080/api/v1
    description: Servidor Local de Desenvolvimento

security:
  - {}
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /healthz:
    get:
      summary: Liveness Probe
      description: Retorna 200 OK se o processo da aplicação estiver rodando.
      operationId: getLiveness
      responses:
        '200':
          description: Processo saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /readyz:
    get:
      summary: Readiness Probe
      description: Retorna 200 OK apenas se as dependências essenciais (PostgreSQL, Storage e Redis se configurado) estiverem saudáveis.
      operationId: getReadiness
      responses:
        '200':
          description: Aplicação pronta para receber tráfego
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
                      storage:
                        type: string
                        example: ok
        '503':
          description: Uma ou mais dependências estão indisponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/register:
    post:
      summary: Cadastro de Novo Usuário
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9_-]+$'
                  example: leitor_otaku
                email:
                  type: string
                  format: email
                  example: usuario@exemplo.com
                password:
                  type: string
                  minLength: 8
                  example: SenhaSegura#2026
                preferred_language:
                  type: string
                  default: pt-br
                  example: pt-br
      responses:
        '201':
          description: Usuário cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      summary: Autenticação de Usuário
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                  description: Email ou Username do usuário
                  example: usuario@exemplo.com
                password:
                  type: string
                  example: SenhaSegura#2026
      responses:
        '200':
          description: Autenticação realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      tokens:
                        $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      summary: Renovação de Token (Rotação de Refresh Token)
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: rt_018d45f3...
      responses:
        '200':
          description: Novos tokens emitidos com rotação do refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /mangas:
    get:
      summary: Listagem e Busca de Obras (Catálogo)
      operationId: listMangas
      parameters:
        - name: format
          in: query
          schema:
            $ref: '#/components/schemas/ContentFormat'
        - name: lang
          in: query
          schema:
            type: string
            default: pt-br
            example: pt-br
        - name: tags_include
          in: query
          description: Slugs ou IDs de tags que DEVEM estar presentes (AND)
          schema:
            type: array
            items:
              type: string
            example: [romance, acao]
        - name: tags_exclude
          in: query
          description: Slugs ou IDs de tags que NÃO podem estar presentes (NOT)
          schema:
            type: array
            items:
              type: string
            example: [netorare, gore]
        - name: search
          in: query
          description: Busca textual de título via pg_trgm
          schema:
            type: string
            example: solo
        - name: sort
          in: query
          schema:
            type: string
            enum: [trending, popular, latest, rating]
            default: trending
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - name: cursor
          in: query
          description: Cursor opaco para paginação keyset
          schema:
            type: string
            example: eyJpZCI6IjAxOGQ0NWYz...
      responses:
        '200':
          description: Lista de obras encontrada
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: public, max-age=60, stale-while-revalidate=120
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MangaSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /mangas/{slug}:
    get:
      summary: Detalhes Completos de uma Obra
      operationId: getMangaBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: solo-leveling
        - name: lang
          in: query
          schema:
            type: string
            default: pt-br
      responses:
        '200':
          description: Obra detalhada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/MangaDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /chapters/{id}/pages:
    get:
      summary: Páginas de Leitura de um Capítulo (Mangá / Manhwa / Doujinshi)
      operationId: getChapterPages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 018d4610-b23c-7d4e-af5a-6b7c8d9e0f1a
      responses:
        '200':
          description: Manifesto de páginas do capítulo
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=86400, immutable
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ChapterPagesManifest'
        '403':
          description: Capítulo restrito a VIPs (Acesso Antecipado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /chapters/{id}/sources:
    get:
      summary: Fontes de Streaming e Legendas de um Episódio (Anime / Anime-H)
      operationId: getEpisodeSources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de servidores de vídeo e faixas de legenda
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EpisodeSourcesManifest'
        '404':
          $ref: '#/components/responses/NotFound'

  /chapters/{id}/comments:
    get:
      summary: Comentários Hierárquicos de um Capítulo
      operationId: getChapterComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Árvore hierárquica de comentários
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=30, stale-while-revalidate=60
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
    post:
      summary: Criar Comentário em um Capítulo
      security:
        - BearerAuth: []
      operationId: postComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: UUIDv7 do comentário pai se for uma resposta
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  example: Excelente capítulo! Aguardo a continuação.
      responses:
        '201':
          description: Comentário publicado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /uploads/presigned-url:
    post:
      summary: Solicitar Slots de Upload com Verificação Prévia de Deduplicação
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      operationId: requestUploadSlots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required: [filename, byte_size, sha256_hash, mime_type]
                    properties:
                      filename:
                        type: string
                        example: 01.webp
                      byte_size:
                        type: integer
                        example: 245100
                      sha256_hash:
                        type: string
                        pattern: '^[a-fA-F0-9]{64}$'
                        example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                      mime_type:
                        type: string
                        enum: [image/webp, image/jpeg, image/png, image/avif, video/mp4]
      responses:
        '200':
          description: Slots de upload autorizados ou arquivos já deduplicados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      upload_slots:
                        type: array
                        items:
                          $ref: '#/components/schemas/UploadSlot'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido no login (/auth/login).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key para automação e ingestão de scanlators (prefixo hbk_).

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Autenticação ausente ou inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Sem permissão para o recurso solicitado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Recurso não encontrado ou removido por moderação/DMCA
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflito de estado ou duplicidade de registro
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Limite de requisições excedido (Rate Limit)
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ContentFormat:
      type: string
      enum: [manga, manhwa, manhua, doujinshi, anime_h, anime_m]

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
              example: O mangá solicitado não existe ou foi bloqueado por solicitação legal.
            details:
              type: object
              nullable: true

    PaginationMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
          example: eyJpZCI6IjAxOGQ0NWYz...
        has_more:
          type: boolean
          example: true

    User:
      type: object
      required: [id, username, email, role, preferred_language]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: leitor_otaku
        email:
          type: string
          format: email
        role:
          type: string
          enum: [guest, user, vip, moderator, admin]
        preferred_language:
          type: string
          example: pt-br
        avatar_url:
          type: string
          nullable: true

    UserEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'

    AuthTokens:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1Ni...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: "Tempo de vida em segundos (ex: 900 = 15 minutos)"
          example: 900
        refresh_token:
          type: string
          example: rt_018d45f3...

    TagSummary:
      type: object
      required: [id, name, slug, category]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Romance
        slug:
          type: string
          example: romance
        category:
          type: string
          enum: [general, artist, circle, parody, character, language]

    CreatorSummary:
      type: object
      required: [name, slug, role]
      properties:
        name:
          type: string
          example: Shindol
        slug:
          type: string
          example: shindol
        role:
          type: string
          enum: [story, art, story_and_art, assistant]

    MangaSummary:
      type: object
      required: [id, display_title, slug, format, reading_direction, is_gallery, is_nsfw, cover_url, views_all_time, rating_score]
      properties:
        id:
          type: string
          format: uuid
        display_title:
          type: string
          example: Aventuras no Outro Mundo
        original_title:
          type: string
          example: Otherworldly Adventures
        original_language:
          type: string
          example: ko
        slug:
          type: string
          example: aventuras-no-outro-mundo
        format:
          $ref: '#/components/schemas/ContentFormat'
        reading_direction:
          type: string
          enum: [right_to_left, left_to_right, vertical_scroll]
        is_gallery:
          type: boolean
          example: false
        is_nsfw:
          type: boolean
          example: false
        cover_url:
          type: string
          format: uri
        views_all_time:
          type: integer
          format: int64
          example: 154200
        views_weekly:
          type: integer
          format: int64
          example: 12800
        rating_score:
          type: string
          example: '9.45'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        creators:
          type: array
          items:
            $ref: '#/components/schemas/CreatorSummary'

    MangaDetail:
      allOf:
        - $ref: '#/components/schemas/MangaSummary'
        - type: object
          properties:
            display_description:
              type: string
              example: Uma história fantástica sobre superação e magia em outro mundo.
            alt_titles:
              type: array
              items:
                type: string
            magazine_name:
              type: string
              nullable: true
              example: KakaoPage
            publisher_name:
              type: string
              nullable: true
              example: D&C Media

    ChapterPagesManifest:
      type: object
      required: [chapter_id, reading_direction, pages_count, pages]
      properties:
        chapter_id:
          type: string
          format: uuid
        reading_direction:
          type: string
          enum: [right_to_left, left_to_right, vertical_scroll]
        pages_count:
          type: integer
          example: 28
        pages:
          type: array
          items:
            type: object
            required: [page_number, url, width, height, byte_size]
            properties:
              page_number:
                type: integer
                example: 1
              url:
                type: string
                format: uri
              width:
                type: integer
                example: 1200
              height:
                type: integer
                example: 1800
              byte_size:
                type: integer
                example: 245100

    EpisodeSourcesManifest:
      type: object
      required: [chapter_id, sources, subtitles]
      properties:
        chapter_id:
          type: string
          format: uuid
        sources:
          type: array
          items:
            type: object
            required: [server_name, source_type, resolution, stream_url]
            properties:
              server_name:
                type: string
                example: Main Server
              source_type:
                type: string
                enum: [direct_hls, direct_mp4, external_embed]
              resolution:
                type: string
                example: 1080p
              stream_url:
                type: string
                format: uri
        subtitles:
          type: array
          items:
            type: object
            required: [language_code, label, subtitle_url, is_default]
            properties:
              language_code:
                type: string
                example: pt-br
              label:
                type: string
                example: Português
              subtitle_url:
                type: string
                format: uri
              is_default:
                type: boolean
                example: true

    Comment:
      type: object
      required: [id, user, content, likes_count, dislikes_count, created_at, replies]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        user:
          type: object
          required: [username, role]
          properties:
            username:
              type: string
              example: OtakuMaster
            avatar_url:
              type: string
              nullable: true
            role:
              type: string
              enum: [guest, user, vip, moderator, admin]
        content:
          type: string
          example: Esse capítulo foi sensacional!
        likes_count:
          type: integer
          example: 42
        dislikes_count:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    UploadSlot:
      type: object
      required: [filename, sha256_hash, already_exists]
      properties:
        filename:
          type: string
          example: 01.webp
        sha256_hash:
          type: string
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        upload_url:
          type: string
          nullable: true
          description: URL assinada para envio (null se already_exists for true)
          example: https://storage.honbakoo.org/incoming/temp_e3b0c442...?token=...
        already_exists:
          type: boolean
          description: Se true, o arquivo já existe no banco e o cliente não precisa enviar
          example: false
