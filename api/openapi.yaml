openapi: 3.1.0
info:
  title: Honbakoo Engine API
  version: 1.0.0
  summary: Headless engine for manga, manhwa, doujinshi and anime platforms.
  description: |
    Contract for the Honbakoo Engine HTTP API. This document is asserted against
    the live router by `internal/server/openapi_test.go`: every documented
    operation must exist in the engine and every engine route must be documented.
  contact:
    name: Honbakoo
    url: https://github.com/Honbakoo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.honbakoo.org
    description: Production
tags:
  - name: System
  - name: Auth
  - name: Catalog
  - name: Reader
  - name: Library
  - name: Community
  - name: Editorial
  - name: Admin
  - name: Billing
security:
  - {}
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe (checks PostgreSQL)
      responses:
        '200':
          description: Dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Prometheus metrics (token-protected outside development)
      responses:
        '200':
          description: Prometheus exposition text
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/config:
    get:
      tags: [System]
      operationId: getPublicConfig
      summary: Public runtime capabilities of this deployment
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'

  # ---------------------------------------------------------------- Auth ----
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Registration is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: E-mail already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate with e-mail and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204':
          description: Session revoked

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset link
      description: Returns 200 even for unknown e-mails to prevent account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset flow accepted (token is e-mailed when SMTP is enabled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  debug_token:
                    type: string
                    description: Only present in development/test environments.
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password }
      responses:
        '204':
          description: Password updated
        '400':
          description: Weak password or invalid/expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an e-mail address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204':
          description: E-mail verified
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current account
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Auth]
      operationId: deleteMe
      summary: Erase the account (LGPD right to erasure)
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account scheduled for deletion
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me/export:
    get:
      tags: [Auth]
      operationId: exportMe
      summary: Export all personal data (LGPD portability)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Portable JSON export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/verify-age:
    post:
      tags: [Auth]
      operationId: verifyAge
      summary: Register an acceptable age verification method
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [government_id, payment_card, facial_estimation]
      responses:
        '204':
          description: Age verification recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          description: Verification provider not configured

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the password of the authenticated account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204':
          description: Password changed; other sessions revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/request-email-verification:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      summary: (Re)send the e-mail verification link
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Verification e-mail queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  debug_token:
                    type: string
                    description: Only present in development/test environments.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/api-keys:
    get:
      tags: [Auth]
      operationId: listAPIKeys
      summary: List API keys of the authenticated account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
        '501':
          description: API key service is not enabled
    post:
      tags: [Auth]
      operationId: createAPIKey
      summary: Create a scoped API key
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 64 }
                scopes:
                  type: array
                  items: { type: string }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
                group_id: { type: string, format: uuid }
      responses:
        '201':
          description: API key created; the secret is shown only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/api-keys/{id}:
    delete:
      tags: [Auth]
      operationId: revokeAPIKey
      summary: Revoke an API key
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: API key revoked
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------- Catalog ----
  /api/v1/mangas:
    get:
      tags: [Catalog]
      operationId: searchMangas
      summary: Search and list published works
      description: |
        Keyset pagination. The next cursor is returned in the `X-Next-Cursor`
        response header; pass it back as `cursor`.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Title search (trigram, case-insensitive)
        - name: format
          in: query
          schema:
            type: string
            enum: [manga, manhwa, manhua, doujinshi, comic, webtoon, light_novel, anime, anime_h]
        - name: status
          in: query
          schema:
            type: string
            enum: [ongoing, completed, hiatus, cancelled]
        - name: tag
          in: query
          schema: { type: integer, format: int32 }
          description: Tag ID
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Matching works
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MangaSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/mangas/updates:
    get:
      tags: [Catalog]
      operationId: listUpdates
      summary: Global feed of recently published chapters
      parameters:
        - name: lang
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Update feed
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatesPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/mangas/tags:
    get:
      tags: [Catalog]
      operationId: listTags
      summary: List tags localized in the requested language
      parameters:
        - name: lang
          in: query
          schema: { type: string, default: pt-br }
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

  /api/v1/mangas/favorites:
    get:
      tags: [Library]
      operationId: listFavorites
      summary: List the authenticated reader's favorites
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Favorite works
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MangaSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/mangas/history:
    get:
      tags: [Library]
      operationId: listHistory
      summary: Reading history ("continue reading")
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Reading history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/mangas/{slug}:
    get:
      tags: [Catalog]
      operationId: getManga
      summary: Work details by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          schema: { type: string, default: pt-br }
      responses:
        '200':
          description: Work details and creators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MangaDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/mangas/{slug}/chapters:
    get:
      tags: [Catalog]
      operationId: listChapters
      summary: Published chapters of a work
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Chapters, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChapterSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/mangas/{id}/rating:
    put:
      tags: [Catalog]
      operationId: rateManga
      summary: Rate a work from 1 to 10
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '204':
          description: Rating stored
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Catalog]
      operationId: deleteRating
      summary: Remove the authenticated reader's rating
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Rating removed

  /api/v1/mangas/{id}/favorite:
    post:
      tags: [Library]
      operationId: addFavorite
      summary: Add a work to favorites
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Added
    delete:
      tags: [Library]
      operationId: removeFavorite
      summary: Remove a work from favorites
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed

  /api/v1/mangas/{id}/history:
    put:
      tags: [Library]
      operationId: upsertHistory
      summary: Record reading progress
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chapter_id: { type: string, format: uuid }
                page_number: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Progress stored
    delete:
      tags: [Library]
      operationId: deleteHistory
      summary: Remove a work from reading history
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed

  # -------------------------------------------------------------- Reader ----
  /api/v1/chapters/{id}/pages:
    get:
      tags: [Reader]
      operationId: getChapterPages
      summary: Reader payload for a chapter
      description: |
        Anonymous access is allowed for SFW chapters. NSFW content requires an
        authenticated account with age verification, and VIP chapters require an
        active VIP subscription when billing is enabled.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chapter, pages and video sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterReader'
        '403':
          description: Age verification or VIP subscription required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chapters/{id}/download:
    get:
      tags: [Reader]
      operationId: downloadChapter
      summary: Download a chapter as a CBZ archive
      description: |
        The archive is fully materialized before the response starts, so a
        failing page can never truncate a 200 response. Subject to
        `download_mode` (disabled, public or vip_only).
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: CBZ archive
          content:
            application/vnd.comicbook+zip:
              schema:
                type: string
                contentMediaType: application/vnd.comicbook+zip
        '403':
          description: Downloads disabled, VIP required, or age verification missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------- Community ----
  /api/v1/community/chapters/{id}/comments:
    get:
      tags: [Community]
      operationId: listComments
      summary: List chapter comments (tree order)
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Comments
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      tags: [Community]
      operationId: postComment
      summary: Post a comment or reply
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
                parent_id: { type: string, format: uuid }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/community/comments/{id}:
    delete:
      tags: [Community]
      operationId: deleteComment
      summary: Soft-delete a comment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '403':
          description: Not the author nor staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/community/comments/{id}/react:
    post:
      tags: [Community]
      operationId: reactToComment
      summary: Like or dislike a comment (idempotent)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_like]
              properties:
                is_like: { type: boolean }
      responses:
        '204':
          description: Reaction stored
    delete:
      tags: [Community]
      operationId: removeCommentReaction
      summary: Remove the current reaction
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Reaction removed

  /api/v1/community/reports:
    post:
      tags: [Community]
      operationId: createReport
      summary: Report a work, chapter or comment (DMCA, abuse)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              properties:
                target_type:
                  type: string
                  enum: [manga, chapter, comment, user]
                target_id: { type: string, format: uuid }
                reason:
                  type: string
                  enum: [dmca, csam, spam, harassment, nsfw_mislabel, other]
                details: { type: string, maxLength: 4000 }
                group_id: { type: string, format: uuid }
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/community/groups/{id}/reports:
    get:
      tags: [Community]
      operationId: listGroupReports
      summary: Reports assigned to a scanlation group
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '403':
          description: Not a member nor staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/community/reports/{id}/resolve:
    post:
      tags: [Community]
      operationId: resolveGroupReport
      summary: Resolve a report assigned to the caller's group
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '204':
          description: Resolved
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Report already resolved

  # ------------------------------------------------------------ Editorial ----
  /api/v1/editorial/groups:
    post:
      tags: [Editorial]
      operationId: createGroup
      summary: Create a scanlation group
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
                website_url: { type: string, format: uri }
                discord_url: { type: string, format: uri }
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/editorial/groups/{id}/members:
    post:
      tags: [Editorial]
      operationId: addGroupMember
      summary: Add a member to a scanlation group
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string, format: uuid }
                role:
                  type: string
                  enum: [leader, uploader, editor, translator, proofreader, cleaner, typesetter]
      responses:
        '204':
          description: Member added
        '403':
          description: Not a leader of the group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/mangas:
    post:
      tags: [Editorial]
      operationId: createManga
      summary: Create a work
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMangaRequest'
      responses:
        '201':
          description: Work created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MangaEditorial'
        '403':
          description: Not authorized by the editorial creation policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/mangas/{id}:
    patch:
      tags: [Editorial]
      operationId: updateManga
      summary: Edit or publish a work
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMangaRequest'
      responses:
        '200':
          description: Updated work
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MangaEditorial'
        '403':
          description: Not authorized for this work
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Editorial]
      operationId: deleteManga
      summary: Delete a work
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/mangas/{id}/chapters:
    post:
      tags: [Editorial]
      operationId: createChapter
      summary: Create a chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterRequest'
      responses:
        '201':
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterSummary'

  /api/v1/editorial/chapters/{id}:
    patch:
      tags: [Editorial]
      operationId: updateChapter
      summary: Edit or publish a chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChapterRequest'
      responses:
        '200':
          description: Updated chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterSummary'
    delete:
      tags: [Editorial]
      operationId: deleteChapter
      summary: Delete a chapter and its pages
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted

  /api/v1/editorial/chapters/{id}/pages:
    post:
      tags: [Editorial]
      operationId: uploadPage
      summary: Upload a page image (multipart/form-data)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, page_number]
              properties:
                file:
                  type: string
                  format: binary
                page_number:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Page attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '413':
          description: Payload too large
        '403':
          description: Blocked media or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/chapters/{id}/pages/import:
    post:
      tags: [Editorial]
      operationId: importPages
      summary: Append pages from remote image URLs
      description: Fetches through the SSRF-safe ingestion client and stores via CAS.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uri }
      responses:
        '201':
          description: Pages imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  pages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Media'
        '502':
          description: Upstream fetch failed (no internal details leaked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/chapters/{id}/pages/order:
    patch:
      tags: [Editorial]
      operationId: reorderPages
      summary: Reorder pages atomically
      description: |
        `page_numbers` must be a full permutation of the chapter's current page
        numbers. Index 0 becomes page 1.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page_numbers]
              properties:
                page_numbers:
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Pages reordered
        '400':
          description: Not a full permutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editorial/chapters/{id}/pages/{page_number}:
    delete:
      tags: [Editorial]
      operationId: deletePage
      summary: Delete a page
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: page_number
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Admin ----
  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: List accounts (keyset pagination)
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Accounts
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  next_cursor: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/reports:
    get:
      tags: [Admin]
      operationId: adminListReports
      summary: List open reports across the platform
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Open reports
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/reports/{id}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolveReport
      summary: Resolve any report
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '204':
          description: Resolved
        '409':
          description: Report already resolved

  /api/v1/admin/dmca/block:
    post:
      tags: [Admin]
      operationId: dmcaBlock
      summary: DMCA-block a work or chapter (cascades to chapters in the reader)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type:
                  type: string
                  enum: [manga, chapter]
                target_id: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '204':
          description: Blocked
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/dmca/unblock:
    post:
      tags: [Admin]
      operationId: dmcaUnblock
      summary: Lift a DMCA block
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type:
                  type: string
                  enum: [manga, chapter]
                target_id: { type: string, format: uuid }
      responses:
        '204':
          description: Unblocked
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users/{id}/ban:
    post:
      tags: [Admin]
      operationId: banUser
      summary: Suspend an account
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Banned
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{id}/unban:
    post:
      tags: [Admin]
      operationId: unbanUser
      summary: Restore a suspended account
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Unbanned

  # -------------------------------------------------------------- Billing ----
  /api/v1/billing/webhook:
    post:
      tags: [Billing]
      operationId: billingWebhook
      summary: Payment provider webhook (HMAC + anti-replay + idempotency)
      security: []
      parameters:
        - name: X-Honbakoo-Signature
          in: header
          schema: { type: string }
        - name: Stripe-Signature
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted or already processed
        '401':
          description: Invalid signature
        '503':
          description: Billing disabled on this deployment

  /api/v1/billing/webhook/{provider}:
    post:
      tags: [Billing]
      operationId: billingWebhookProvider
      summary: Payment provider webhook with explicit provider segment
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [stripe, generic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted or already processed
        '401':
          description: Invalid signature

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Dependency unavailable, maintenance mode, or feature disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        code: { type: string }

    Health:
      type: object
      properties:
        status: { type: string }
        timestamp: { type: string, format: date-time }
        version: { type: string }

    Ready:
      type: object
      properties:
        status: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
        timestamp: { type: string, format: date-time }

    PublicConfig:
      type: object
      properties:
        site_name: { type: string }
        public_url: { type: string }
        profile: { type: string, enum: [budget, scale] }
        allow_registration: { type: boolean }
        age_verification_mode: { type: string, enum: [disabled, self_declaration, strict] }
        billing_enabled: { type: boolean }
        comments_enabled: { type: boolean }
        reports_enabled: { type: boolean }
        download_mode: { type: string, enum: [disabled, public, vip_only] }
        catalog_mode: { type: string, enum: [hybrid, sfw_only, nsfw_only] }
        read_only: { type: boolean }

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        preferred_language: { type: string, default: pt-br }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, moderator, admin] }
        preferred_language: { type: string }
        age_verified: { type: boolean }
        is_banned: { type: boolean }
        vip_until: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token: { type: string }
        refresh_token: { type: string }

    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }

    APIKeyCreated:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          properties:
            key: { type: string, description: Shown only once. }

    MangaSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        original_title: { type: string }
        display_title: { type: string }
        format: { type: string }
        status: { type: string }
        cover_url: { type: string }
        is_nsfw: { type: boolean }
        tag_ids:
          type: array
          items: { type: integer }
        views_all_time: { type: integer }
        rating_score: { type: number }
        created_at: { type: string, format: date-time }

    MangaDetail:
      type: object
      properties:
        manga:
          type: object
          additionalProperties: true
        creators:
          type: array
          items:
            type: object
            additionalProperties: true

    MangaEditorial:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        original_title: { type: string }
        format: { type: string }
        status: { type: string }
        is_nsfw: { type: boolean }
        cover_url: { type: string }
        is_published: { type: boolean }
        published_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    CreateMangaRequest:
      type: object
      required: [original_title, slug, cover_url]
      properties:
        original_title: { type: string }
        original_language: { type: string, default: ja }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        format:
          type: string
          enum: [manga, manhwa, manhua, doujinshi, comic, webtoon, light_novel, anime, anime_h]
        reading_direction:
          type: string
          enum: [right_to_left, left_to_right, top_to_bottom]
        is_gallery: { type: boolean }
        is_nsfw: { type: boolean }
        is_vip_exclusive: { type: boolean }
        cover_url: { type: string }
        tag_ids:
          type: array
          items: { type: integer }
        is_published: { type: boolean }
        group_id: { type: string, format: uuid }

    UpdateMangaRequest:
      type: object
      properties:
        original_title: { type: string }
        status:
          type: string
          enum: [ongoing, completed, hiatus, cancelled]
        cover_url: { type: string }
        tag_ids:
          type: array
          items: { type: integer }
        is_nsfw: { type: boolean }
        is_published: { type: boolean }

    CreateChapterRequest:
      type: object
      required: [chapter_number]
      properties:
        group_id: { type: string, format: uuid }
        chapter_number: { type: number }
        volume_number: { type: string }
        title: { type: string }
        language_code: { type: string, default: pt-br }
        media_type: { type: string, enum: [image_pages, video_hls, video_mp4] }
        is_vip_early_access: { type: boolean }
        is_vip_exclusive: { type: boolean }
        is_published: { type: boolean }

    UpdateChapterRequest:
      type: object
      properties:
        chapter_number: { type: number }
        volume_number: { type: string }
        title: { type: string }
        is_vip_early_access: { type: boolean }
        is_vip_exclusive: { type: boolean }
        is_published: { type: boolean }

    ChapterSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        manga_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid, nullable: true }
        group_name: { type: string, nullable: true }
        chapter_number: { type: number }
        volume_number: { type: string, nullable: true }
        title: { type: string, nullable: true }
        language_code: { type: string }
        media_type: { type: string }
        is_vip_early_access: { type: boolean }
        is_vip_exclusive: { type: boolean }
        published_at: { type: string, format: date-time, nullable: true }

    ChapterReader:
      type: object
      properties:
        chapter:
          type: object
          additionalProperties: true
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        sources:
          type: array
          items:
            type: object
            additionalProperties: true

    Page:
      type: object
      properties:
        page_number: { type: integer }
        media_id: { type: string, format: uuid }
        storage_provider: { type: string }
        storage_key: { type: string }
        mime_type: { type: string }
        byte_size: { type: integer }
        width: { type: integer }
        height: { type: integer }
        blurhash: { type: string, nullable: true }
        variants:
          type: object
          additionalProperties: true

    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        sha256_hash: { type: string }
        storage_key: { type: string }
        public_url: { type: string }
        mime_type: { type: string }
        byte_size: { type: integer }
        width: { type: integer }
        height: { type: integer }
        deduplicated: { type: boolean }

    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        category: { type: string }

    UpdatesPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor: { type: string }

    HistoryEntry:
      type: object
      properties:
        manga_id: { type: string, format: uuid }
        manga_slug: { type: string }
        manga_title: { type: string }
        cover_url: { type: string }
        chapter_id: { type: string, format: uuid }
        chapter_number: { type: number }
        page_number: { type: integer }
        updated_at: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        avatar_url: { type: string }
        user_role: { type: string }
        chapter_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        path: { type: string }
        depth: { type: integer }
        content: { type: string }
        likes_count: { type: integer }
        dislikes_count: { type: integer }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }

    ResolveReportRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [upheld, rejected, duplicate, action_taken]
        note: { type: string, maxLength: 2000 }

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, moderator, admin] }
        is_banned: { type: boolean }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
