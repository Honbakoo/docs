openapi: 3.1.0
info:
  title: Honbakoo Engine API
  version: 1.0.0
  summary: Headless engine for manga, manhwa, doujinshi and anime platforms.
  description: |
    Contract for the Honbakoo Engine HTTP API. This document is asserted against
    the live router by `internal/server/openapi_test.go`: every documented
    operation must exist in the engine and every engine route must be documented.
  contact:
    name: Honbakoo
    url: https://github.com/Honbakoo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.honbakoo.org
    description: Production
tags:
  - name: System
  - name: Auth
  - name: Catalog
  - name: Reader
  - name: Library
  - name: Community
  - name: Editorial
  - name: Admin
  - name: Billing
security:
  - {}
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Liveness probe
      responses:
        '4XX':
          description: Client error
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe (checks PostgreSQL)
      responses:
        '4XX':
          description: Client error
        '200':
          description: Dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Prometheus metrics (token-protected outside development)
      responses:
        '200':
          description: Prometheus exposition text
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/config:
    get:
      tags: [System]
      operationId: getPublicConfig
      summary: Public runtime capabilities of this deployment
      responses:
        '4XX':
          description: Client error
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'

  # ---------------------------------------------------------------- Auth ----
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Registration is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: E-mail already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate with e-mail and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '4XX':
          description: Client error
        '204':
          description: Session revoked

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset link
      description: Returns 200 even for unknown e-mails to prevent account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset flow accepted (token is e-mailed when SMTP is enabled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  debug_token:
                    type: string
                    description: Only present in development/test environments.
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password }
      responses:
        '204':
          description: Password updated
        '400':
          description: Weak password or invalid/expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an e-mail address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204':
          description: E-mail verified
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current account
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Auth]
      operationId: deleteMe
      summary: Erase the account (LGPD right to erasure)
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account scheduled for deletion
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me/export:
    get:
      tags: [Auth]
      operationId: exportMe
      summary: Export all personal data (LGPD portability)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Portable JSON export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/verify-age:
    post:
      tags: [Auth]
      operationId: verifyAge
      summary: Register an acceptable age verification method
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [government_id, payment_card, facial_estimation]
      responses:
        '200':
          description: Age verification recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeVerificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Unsupported verification method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Verification provider not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/age-verification:
    get:
      tags: [Auth]
      operationId: getAgeVerification
      summary: Get the effective age verification status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current age verification state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeVerificationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the password of the authenticated account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204':
          description: Password changed; other sessions revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/request-email-verification:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      summary: (Re)send the e-mail verification link
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Verification e-mail queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  debug_token:
                    type: string
                    description: Only present in development/test environments.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/api-keys:
    get:
      tags: [Auth]
      operationId: listAPIKeys
      summary: List API keys of the authenticated account
      security:
        - BearerAuth: []
      responses:
        '4XX':
          description: Client error
        '200':
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
        '501':
          description: API key service is not enabled
    post:
      tags: [Auth]
      operationId: createAPIKey
      summary: Create a scoped API key
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 64 }
                scopes:
                  type: array
                  items: { type: string }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
                group_id: { type: string, format: uuid }
      responses:
        '201':
          description: API key created; the secret is shown only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/api-keys/{id}:
    delete:
      tags: [Auth]
      operationId: revokeAPIKey
      summary: Revoke an API key
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: API key revoked
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------- Catalog ----
  /api/v1/mangas:
    get:
      tags: [Catalog]
      operationId: searchMangas
      summary: Search and list published works
      description: |
        Keyset pagination. The next cursor is returned in the `X-Next-Cursor`
        response header; pass it back as `cursor`.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Title search (trigram, case-insensitive)
        - name: format
          in: query
          schema:
            type: string
            enum: [manga, manhwa, manhua, doujinshi, comic, webtoon, light_novel, anime, anime_h]
        - name: status
          in: query
          schema:
            type: string
            enum: [ongoing, completed, hiatus, cancelled]
        - name: tag
          in: query
          schema: { type: integer, format: int32 }
          description: Tag ID
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Matching works
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MangaSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/mangas/updates:
    get:
      tags: [Catalog]
      operationId: listUpdates
      summary: Global feed of recently published chapters
      parameters:
        - name: lang
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Update feed
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatesPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/mangas/tags:
    get:
      tags: [Catalog]
      operationId: listTags
      summary: List tags localized in the requested language
      parameters:
        - name: lang
          in: query
          schema: { type: string, default: pt-br }
        - name: category
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [popular, az] }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '4XX':
          description: Client error
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

  /api/v1/mangas/facets:
    get:
      tags: [Catalog]
      operationId: getCatalogFacets
      summary: Aggregate facet counts for catalog filtering
      responses:
        '200':
          description: Catalog facets
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/mangas/taxonomies/{kind}:
    get:
      tags: [Catalog]
      operationId: listTaxonomy
      summary: List taxonomy directory entries with counts and sorting
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [tags, parodies, characters, circles, artists, groups, languages, magazines]
        - name: lang
          in: query
          schema: { type: string, default: pt-br }
        - name: sort
          in: query
          schema: { type: string, enum: [popular, az], default: popular }
        - name: q
          in: query
          schema: { type: string }
        - name: letter
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Taxonomy directory
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/mangas/favorites:
    get:
      tags: [Library]
      operationId: listFavorites
      summary: List the authenticated reader's favorites
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Favorite works
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MangaSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/mangas/history:
    get:
      tags: [Library]
      operationId: listHistory
      summary: Reading history ("continue reading")
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Reading history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/mangas/{slug}:
    get:
      tags: [Catalog]
      operationId: getManga
      summary: Work details by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          schema: { type: string, default: pt-br }
      responses:
        '200':
          description: Work details and creators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MangaDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/mangas/{slug}/chapters:
    get:
      tags: [Catalog]
      operationId: listChapters
      summary: Published chapters of a work
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Chapters, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChapterSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/mangas/{id}/rating:
    put:
      tags: [Catalog]
      operationId: rateManga
      summary: Rate a work from 1 to 10
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '204':
          description: Rating stored
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Catalog]
      operationId: deleteRating
      summary: Remove the authenticated reader's rating
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '4XX':
          description: Client error
        '204':
          description: Rating removed

  /api/v1/mangas/{id}/favorite:
    post:
      tags: [Library]
      operationId: addFavorite
      summary: Add a work to favorites
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '4XX':
          description: Client error
        '204':
          description: Added
    delete:
      tags: [Library]
      operationId: removeFavorite
      summary: Remove a work from favorites
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '4XX':
          description: Client error
        '204':
          description: Removed

  /api/v1/mangas/{id}/history:
    put:
      tags: [Library]
      operationId: upsertHistory
      summary: Record reading progress
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chapter_id: { type: string, format: uuid }
                page_number: { type: integer, minimum: 1 }
                video_position_seconds:
                  type: integer
                  minimum: 0
                  description: Playback position for video chapters; ignored for image chapters.
      responses:
        '4XX':
          description: Client error
        '204':
          description: Progress stored
    delete:
      tags: [Library]
      operationId: deleteHistory
      summary: Remove a work from reading history
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '4XX':
          description: Client error
        '204':
          description: Removed

  # -------------------------------------------------------------- Reader ----
  /api/v1/chapters/{id}/pages:
    get:
      tags: [Reader]
      operationId: getChapterPages
      summary: Reader payload for a chapter
      description: |
        Anonymous access is allowed for SFW chapters. NSFW content requires an
        authenticated account with age verification, and VIP chapters require an
        active VIP subscription when billing is enabled.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chapter, pages and video sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterReader'
        '403':
          description: Age verification or VIP subscription required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chapters/{id}/pages/{page}/media:
    get:
      tags: [Reader]
      operationId: getChapterPageMedia
      summary: Stream one chapter page
      description: |
        Serves the image bytes for a page that cannot be exposed through the
        public CDN, such as NSFW or VIP-gated chapters. The response is private
        and must not be stored by shared caches. Public chapters use the CDN URL
        returned in the reader payload instead of this endpoint.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: page
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: token
          in: query
          required: false
          description: Short-lived capability returned in the reader manifest for protected pages. Alternative to the Bearer header for browser image tags.
          schema: { type: string }
      responses:
        '200':
          description: Page image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        '403':
          description: Age verification or VIP subscription required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chapters/{id}/download:
    get:
      tags: [Reader]
      operationId: downloadChapter
      summary: Download a chapter as a CBZ archive
      description: |
        The archive is fully materialized before the response starts, so a
        failing page can never truncate a 200 response. Subject to
        `download_mode` (disabled, public or vip_only).
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: CBZ archive
          content:
            application/vnd.comicbook+zip:
              schema:
                type: string
                contentMediaType: application/vnd.comicbook+zip
        '403':
          description: Downloads disabled, VIP required, or age verification missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------- Community ----
  /api/v1/community/chapters/{id}/comments:
    get:
      tags: [Community]
      operationId: listComments
      summary: List chapter comments (tree order)
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '4XX':
          description: Client error
        '200':
          description: Comments
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      tags: [Community]
      operationId: postComment
      summary: Post a comment or reply
      security:
        - BearerAuth: []
      parameters:
